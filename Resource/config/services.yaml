services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            Psr\Container\ContainerInterface: '@service_container'

    GuzzleHttp\ClientInterface:
        class: GuzzleHttp\Client
        public: false

    Plugin\AiChatAssistant44\Controller\:
        resource: '../../Controller/*'
        public: true
        tags: ['controller.service_arguments']

    Plugin\AiChatAssistant44\:
        resource: '../../*'
        exclude:
            - '../../Tests/'
            - '../../Controller/'

    Plugin\AiChatAssistant44\Service\McpServerService:
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\ProductRepository'
            - '@Plugin\AiChatAssistant44\Service\McpHttpService'

    Plugin\AiChatAssistant44\Service\McpHttpService:
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\ProductRepository'
            - '@Plugin\AiChatAssistant44\Repository\McpAuditRepository'

    Plugin\AiChatAssistant44\Service\RateLimitService:
        arguments:
            - '@cache.app'

    Plugin\AiChatAssistant44\Controller\McpHttpController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\ProductRepository'
            - '@Plugin\AiChatAssistant44\Service\McpHttpService'
            - '@Plugin\AiChatAssistant44\Service\RateLimitService'
            - '@Plugin\AiChatAssistant44\Service\ShopContextService'

    Plugin\AiChatAssistant44\Service\AiAgentFactory: ~

    Plugin\AiChatAssistant44\Service\ApiKeyEncryptor:
        arguments:
            - '%kernel.secret%'
            - '@logger'

    Plugin\AiChatAssistant44\Service\EmailHashService:
        arguments:
            - '%kernel.secret%'
            - '@Plugin\AiChatAssistant44\Service\ApiKeyEncryptor'

    Plugin\AiChatAssistant44\Service\AiModelRegistry:
        arguments:
            $configPath: '%kernel.project_dir%/app/PluginData/AiChatAssistant44/ai_models.json'
            $projectDir: '%kernel.project_dir%'
            $logger: '@logger'

    Plugin\AiChatAssistant44\Service\ChatLogger:
        arguments:
            - '@doctrine.orm.entity_manager'

    Plugin\AiChatAssistant44\Service\LogSyncService:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@GuzzleHttp\ClientInterface'
            - '@logger'

    Plugin\AiChatAssistant44\Controller\Api\ModelApiController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            - '@Plugin\AiChatAssistant44\Service\AiModelRegistry'

    Plugin\AiChatAssistant44\EventListener\ChatWidgetListener:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['kernel.event_subscriber']

    Plugin\AiChatAssistant44\Command\AiChatAssistantCommand:
        tags: ['console.command']

    Plugin\AiChatAssistant44\Command\SyncChatLogsCommand:
        tags: ['console.command']

    Plugin\AiChatAssistant44\Command\CleanupEmailCommand:
        tags: ['console.command']

    Plugin\AiChatAssistant44\Service\NotificationService:
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\NotificationRepository'
            - '@logger'
            - '@mailer.mailer'
            - '@Plugin\AiChatAssistant44\Service\ApiKeyEncryptor'

    Plugin\AiChatAssistant44\Service\AccessRuleService:
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\AccessRuleRepository'
            - '@logger'

    Plugin\AiChatAssistant44\Service\DesignSettingsSyncService:
        arguments:
            $httpClient: '@GuzzleHttp\ClientInterface'
            $logger: '@logger'
            $projectDir: '%kernel.project_dir%'

    Plugin\AiChatAssistant44\Service\AiModelSyncService:
        arguments:
            $httpClient: '@GuzzleHttp\ClientInterface'
            $logger: '@logger'
            $projectDir: '%kernel.project_dir%'

    Plugin\AiChatAssistant44\Controller\Admin\DashboardController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $syncService: '@Plugin\AiChatAssistant44\Service\AiModelSyncService'

    Plugin\AiChatAssistant44\Controller\Admin\DesignController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            $projectDir: '%kernel.project_dir%'
            $syncService: '@Plugin\AiChatAssistant44\Service\DesignSettingsSyncService'

    Plugin\AiChatAssistant44\Controller\Admin\NotificationController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\NotificationRepository'
            - '@Plugin\AiChatAssistant44\Service\ApiKeyEncryptor'

    Plugin\AiChatAssistant44\Controller\Admin\AccessRuleController:
        public: true
        tags: ['controller.service_arguments']
        arguments:
            - '@Plugin\AiChatAssistant44\Repository\AccessRuleRepository'
