# Routes for AiChatAssistant42 plugin - manually defined for Symfony 5.4

ai_chat_assistant_api_chat:
    path: /api/ai-chat-assistant/chat
    methods: [POST]
    defaults:
        _controller: Plugin\AiChatAssistant42\Controller\Api\ChatApiController::chat

ai_chat_assistant_api_email_reply_request:
    path: /api/ai-chat-assistant/email-reply-request
    methods: [POST]
    defaults:
        _controller: Plugin\AiChatAssistant42\Controller\Api\ChatApiController::emailReplyRequest

ai_chat_assistant_api_feedback:
    path: /api/ai-chat-assistant/feedback
    methods: [POST]
    defaults:
        _controller: Plugin\AiChatAssistant42\Controller\Api\ChatApiController::feedback

ai_chat_assistant_models_list:
    path: /api/ai-chat-assistant/models
    methods: [GET]
    defaults:
        _controller: Plugin\AiChatAssistant42\Controller\Api\ModelApiController::list

admin_ai_chat_assistant_access_index:
    path: /%eccube_admin_route%/ai-chat-assistant/access
