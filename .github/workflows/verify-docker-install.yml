name: verify-docker-install

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      version:
        description: "EC-CUBE version to test (4.2, 4.3, both)"
        required: false
        default: "both"

jobs:
  local-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: composer validate (dep-on-root gate)
        run: |
          grep -q '"ec-cube/ec-cube"' composer.json && { echo "ec-cube/ec-cube found in composer.json (dep-on-root)"; exit 1; } || echo "composer.json OK (no ec-cube/ec-cube)"
          composer validate --no-check-publish
          composer validate --strict || true
      - name: services.yaml ContainerInterface bind gate
        run: |
          grep -q "ContainerInterface" Resource/config/services.yaml || { echo "ContainerInterface bind missing"; exit 1; }
          echo "services.yaml OK"
      - name: php syntax
        run: find . -name "*.php" -type f -not -path "./vendor/*" | xargs -n1 php -l
      - name: yaml lint
        run: |
          php -r "require 'vendor/autoload.php'; use Symfony\Component\Yaml\Yaml; Yaml::parseFile('Resource/config/services.yaml'); echo \"yaml OK\n\";"
      - name: unit tests
        run: vendor/bin/phpunit --testsuite unit

  docker-install:
    needs: local-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ec_cube_version: "4.2"
            php_image: "php:8.1-apache-bullseye"
            port: 8080
          - ec_cube_version: "4.3"
            php_image: "php:8.2-apache-bullseye"
            port: 8081
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Clone EC-CUBE ${{ matrix.ec_cube_version }}
        run: git clone -b ${{ matrix.ec_cube_version }} https://github.com/EC-CUBE/ec-cube.git /tmp/eccube-verify
      - name: Prepare compose files
        run: |
          cp plugin/docker-compose.verify.yml /tmp/eccube-verify/docker-compose.verify.yml
          cp plugin/.env.verify /tmp/eccube-verify/.env
      - name: docker compose up
        working-directory: /tmp/eccube-verify
        env:
          PHP_IMAGE: ${{ matrix.php_image }}
          PLUGIN_DIR: ${{ github.workspace }}/plugin
          ECCUBE_PORT: ${{ matrix.port }}
        run: |
          docker compose -f docker-compose.verify.yml up -d --build
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.verify.yml exec -T eccube php -v > /dev/null 2>&1; then
              echo "eccube ready (try $i)"; break; fi
            sleep 2
            if [ $i -eq 30 ]; then docker compose -f docker-compose.verify.yml logs --tail 50 eccube; exit 1; fi
          done
      - name: eccube:install
        working-directory: /tmp/eccube-verify
        run: |
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console eccube:install --no-interaction || \
            (docker compose -f docker-compose.verify.yml exec -T eccube php bin/console doctrine:database:create --if-not-exists; \
             docker compose -f docker-compose.verify.yml exec -T eccube php bin/console doctrine:migrations:migrate --no-interaction)
      - name: plugin install/enable (store審査再現)
        working-directory: /tmp/eccube-verify
        run: |
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console eccube:plugin:install --code=AiChatAssistant42
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console eccube:plugin:enable --code=AiChatAssistant42
      - name: cache warmup (4.3 ContainerInterface gate)
        working-directory: /tmp/eccube-verify
        run: |
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console cache:clear --no-warmup
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console cache:warmup
          docker compose -f docker-compose.verify.yml exec -T eccube php bin/console debug:container 'Plugin\AiChatAssistant42\Controller\Api\ChatApiController' --show-arguments | head -n 50
      - name: debug:router (28 routes)
        working-directory: /tmp/eccube-verify
        run: |
          COUNT=$(docker compose -f docker-compose.verify.yml exec -T eccube php bin/console debug:router | grep -c ai_chat || true)
          echo "ai_chat routes: $COUNT"
          test "$COUNT" -ge 20
      - name: API smoke (not 500)
        working-directory: /tmp/eccube-verify
        run: |
          CODE=$(docker compose -f docker-compose.verify.yml exec -T eccube curl -s -o /tmp/api.json -w "%{http_code}" -X POST http://localhost/api/ai-chat-assistant/chat -H "Content-Type: application/json" -d '{"message":"hello","session_id":"ci-smoke"}' || echo "000")
          echo "HTTP $CODE"; cat /tmp/api.json 2>/dev/null || true; test "$CODE" != "500"
      - name: logs on failure
        if: failure()
        working-directory: /tmp/eccube-verify
        run: |
          docker compose -f docker-compose.verify.yml exec -T eccube cat var/log/dev.log | tail -n 100 || true
          docker compose -f docker-compose.verify.yml logs --tail 100 eccube || true
      - name: down
        if: always()
        working-directory: /tmp/eccube-verify
        run: docker compose -f docker-compose.verify.yml down -v || true
