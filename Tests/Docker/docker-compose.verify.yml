services:
  eccube:
    image: ${PHP_IMAGE:-php:8.1-apache-bullseye}
    ports:
      - "${ECCUBE_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      # PLUGIN_DIR はホスト側のプラグイン配置パス。デフォルトは EC-CUBE の sibling にある想定
      # 例: EC-CUBE が /tmp/eccube-verify、プラグインが /tmp/ec-cube-ai-chat-assistant42 の場合
      #      PLUGIN_DIR=../ec-cube-ai-chat-assistant42 docker compose ... で上書き可能
      # S-02: code分離対応。PLUGIN_MOUNT でマウント先codeを切替 (4.2/4.3=AiChatAssistant42, 4.4=AiChatAssistant44)。
      #      verify-docker-install.sh がバージョン毎に PLUGIN_MOUNT を設定する。既定は44 (本ブランチ)。
      #      port: 4.2=8080 / 4.3=8081 / 4.4=8082。PHP: 4.2=8.1 / 4.3=8.2 / 4.4=8.3系。
      - ${PLUGIN_DIR:-../ec-cube-ai-chat-assistant42}:/var/www/html/app/Plugin/${PLUGIN_MOUNT:-AiChatAssistant44}:rw
      # プラグイン単体の vendor は EC-CUBE と競合するため hide（EC-CUBE 側の autoload のみを使用）
      # 新旧両codeをhide (片方は空ディレクトリとして無害。両載せ時の衝突回避)。
      - plugin_vendor_empty:/var/www/html/app/Plugin/${PLUGIN_MOUNT:-AiChatAssistant44}/vendor
      - plugin_vendor_empty_42:/var/www/html/app/Plugin/AiChatAssistant42/vendor
      - eccube_var:/var/www/html/var
      - eccube_vendor:/var/www/html/vendor
    environment:
      APP_ENV: "dev"
      APP_DEBUG: 1
      DATABASE_URL: "sqlite:///var/eccube.db"
      DATABASE_SERVER_VERSION: 3
      ECCUBE_AUTH_MAGIC: "verify-magic"
      ECCUBE_ADMIN_ROUTE: "admin"
    command: >
      bash -c "
      apt-get update && apt-get install -y libicu-dev libzip-dev libpng-dev libjpeg-dev libfreetype6-dev libonig-dev libsqlite3-dev git unzip sqlite3 &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install -j$$(nproc) zip gd intl pdo pdo_sqlite opcache &&
      echo 'memory_limit=512M' > /usr/local/etc/php/conf.d/zz-memory-limit.ini &&
      a2enmod rewrite &&
      echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
      apache2-foreground
      "

volumes:
  eccube_var:
  eccube_vendor:
  plugin_vendor_empty:
  plugin_vendor_empty_42:
